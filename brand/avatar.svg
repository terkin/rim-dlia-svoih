<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="32%" r="78%">
      <stop offset="0" stop-color="#274B78"/>
      <stop offset="0.6" stop-color="#132844"/>
      <stop offset="1" stop-color="#0A1424"/>
    </radialGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0057B7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#0057B7" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFD700" stop-opacity="0.55"/>
    </linearGradient>
    <clipPath id="circ">
      <circle cx="256" cy="256" r="256"/>
    </clipPath>
    <mask id="arch">
      <rect width="512" height="512" fill="#fff"/>
      <g fill="#000">
        <rect x="116" y="196" width="40" height="66" rx="20"/>
        <rect x="176" y="196" width="40" height="66" rx="20"/>
        <rect x="236" y="196" width="40" height="66" rx="20"/>
        <rect x="296" y="196" width="40" height="66" rx="20"/>
        <rect x="356" y="196" width="40" height="66" rx="20"/>
        <rect x="116" y="288" width="40" height="58" rx="20"/>
        <rect x="176" y="288" width="40" height="58" rx="20"/>
        <rect x="236" y="288" width="40" height="58" rx="20"/>
        <rect x="296" y="288" width="40" height="58" rx="20"/>
        <rect x="356" y="288" width="40" height="58" rx="20"/>
      </g>
    </mask>
  </defs>

  <g clip-path="url(#circ)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect y="290" width="512" height="222" fill="url(#glow)"/>
    <circle cx="256" cy="250" r="150" fill="#FFD166" opacity="0.07"/>

    <!-- top broken edge -->
    <rect x="96" y="144" width="88" height="24" rx="9" fill="#F2C14E"/>
    <rect x="328" y="144" width="88" height="24" rx="9" fill="#F2C14E"/>

    <!-- colosseum body with cut-out arches -->
    <g mask="url(#arch)">
      <rect x="96" y="160" width="320" height="230" rx="14" fill="#F2C14E"/>
    </g>

    <!-- cornice -->
    <rect x="96" y="160" width="320" height="26" rx="8" fill="#FFDD8A"/>
    <!-- base -->
    <rect x="84" y="384" width="344" height="16" rx="8" fill="#C99A2E"/>

    <!-- inner ring -->
    <circle cx="256" cy="256" r="244" fill="none" stroke="#F2C14E" stroke-opacity="0.28" stroke-width="10"/>
  </g>
</svg>
